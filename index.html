<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Set the theme before first paint so there is no light/dark flash.
      (function () {
        var pref = 'system';
        try { pref = localStorage.getItem('sd_theme') || 'system'; } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <script>
      // Launch splash: in the installed app (Capacitor or home-screen PWA), once per launch.
      // Not on the web (readers arrive on links) nor on a shared company link. ?splash forces it.
      (function () {
        var app = !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform()) ||
          matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        var seen = false;
        try { seen = sessionStorage.getItem('sd_splash') === '1'; } catch (e) {}
        var on = /[?&]splash\b/.test(location.search) || (app && !seen && !/^#\/s\//.test(location.hash));
        var calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
        var start = Date.now();
        window.sdSplashDone = function () {
          var el = document.getElementById('splash');
          if (!on || !el || el.dataset.out) return;
          el.dataset.out = '1';
          // let the mark land before it leaves; the app is already painted underneath
          setTimeout(function () {
            el.classList.add('is-out');
            setTimeout(function () { el.remove(); }, 420);
          }, Math.max(0, (calm ? 400 : 1450) - (Date.now() - start)));
        };
        if (!on) return;
        document.documentElement.classList.add('sd-splash');
        try { sessionStorage.setItem('sd_splash', '1'); } catch (e) {}
        setTimeout(window.sdSplashDone, 5000); // never stay up if the app never says it is ready
      })();
    </script>
    <style>
      #splash { display: none; }
      .sd-splash #splash {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 30px; background: #1A1915; color: #F3EFE6;
        font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', system-ui, sans-serif;
        transition: opacity .38s ease, visibility 0s linear .38s;
      }
      .sd-splash #splash::before {
        content: ''; position: absolute; left: 50%; top: 50%; width: 340px; height: 340px; margin: -230px 0 0 -170px;
        border-radius: 50%; background: radial-gradient(closest-side, rgba(224, 74, 47, .16), rgba(224, 74, 47, 0));
        animation: sd-glow 1.6s ease-out .35s both;
      }
      .splash__mark { position: relative; width: 84px; height: 84px; }
      .splash__s { display: block; width: 100%; height: 100%; animation: sd-rise .6s cubic-bezier(.2, .8, .2, 1) .08s both; }
      .splash__dot {
        position: absolute; left: 76.3%; top: 76.3%; width: 19.3%; height: 19.3%; background: #E04A2F;
        transform-origin: 50% 100%; animation: sd-drop .62s cubic-bezier(.3, .7, .3, 1) .5s both;
      }
      .splash__word { position: relative; text-align: center; animation: sd-rise .55s cubic-bezier(.2, .8, .2, 1) .78s both; }
      .splash__name { font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
      .splash__name i { display: inline-block; width: 5px; height: 5px; margin-left: 2px; background: #E04A2F; }
      .splash__tag { margin-top: 8px; font-size: 13px; color: rgba(243, 239, 230, .55); letter-spacing: -.005em; }
      #splash.is-out { opacity: 0; visibility: hidden; }
      #splash.is-out .splash__mark { transform: scale(1.08); transition: transform .4s cubic-bezier(.4, 0, .2, 1); }
      @keyframes sd-rise { from { opacity: 0; transform: translateY(12px) scale(.94); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
      @keyframes sd-drop {
        0% { opacity: 0; transform: translateY(-320%) scale(.7); }
        55% { opacity: 1; transform: translateY(0) scale(1.22, .78); }
        75% { transform: translateY(-14%) scale(.94, 1.08); }
        100% { opacity: 1; transform: none; }
      }
      @keyframes sd-glow { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        .sd-splash #splash::before, .splash__s, .splash__dot, .splash__word { animation: none; }
        #splash.is-out .splash__mark { transform: none; }
      }
    </style>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
    <script>
      // Start fetching the issue list now, in the reading language (see src/lib/i18n.js).
      (function () {
        var lang = new URLSearchParams(location.search).get('lang');
        try { lang = lang || JSON.parse(localStorage.getItem('sd_lang')); } catch (e) {}
        if (lang !== 'ko' && lang !== 'en') lang = /^ko\b/i.test(navigator.language || '') ? 'ko' : 'en';
        document.documentElement.lang = lang;
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'fetch'; l.crossOrigin = 'anonymous';
        l.href = lang === 'en' ? '/data/en/index.json' : '/data/index.json';
        document.head.appendChild(l);
      })();
    </script>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash__mark"><img class="splash__s" src="/splash/mark.png" alt="" width="84" height="84" /><span class="splash__dot"></span></div>
      <div class="splash__word">
        <div class="splash__name">Startup Daily<i></i></div>
        <div class="splash__tag">아직 모르는, 지금 뜨는 스타트업</div>
      </div>
    </div>
    <script>
      if (document.documentElement.lang === 'en') document.querySelector('.splash__tag').textContent = 'Startups you haven’t heard of yet'
    </script>
    <div id="root">
      <!-- static shell, replaced when the app mounts -->
      <div class="boot" aria-busy="true">
        <header class="appbar"><div class="appbar__inner"><span class="wordmark">Startup Daily<span class="wordmark__dot"></span></span></div></header>

        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
        })
      }
    </script>
