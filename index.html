<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Set the theme before first paint so there is no light/dark flash.
      (function () {
        var pref = 'system';
        try { pref = localStorage.getItem('sd_theme') || 'system'; } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <title>Startup Daily — 아직 모르는, 지금 뜨는 스타트업</title>
    <meta name="description" content="한국 독자가 아직 잘 모르는, 지금 뜨는 회사를 하루 한 묶음으로 소개합니다. AI가 공개 자료로 작성합니다." />
    <meta name="theme-color" content="#F3EFE6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Startup Daily" />
    <meta property="og:title" content="Startup Daily — 아직 모르는, 지금 뜨는 스타트업" />
    <meta property="og:description" content="지금 뜨는 회사를 하루 한 묶음으로. 왜 지금인지, 무엇을 하는지, 숫자로 보면 어떤지." />
    <meta property="og:url" content="https://startup-daily.vercel.app/" />
    <meta property="og:image" content="https://startup-daily.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
        })
      }
    </script>
  </body>
</html>
