<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>잉크 블루 브리핑</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ===== v2 tokens (same values as 02_visual-designer_system.md §2.6), scoped per theme ===== */
:root, [data-theme="light"] {
  color-scheme: light;
  --sd-bg: #F5F5F3; --sd-surface: #FFFFFF; --sd-surface-2: #EDEDEA; --sd-surface-raised: #FFFFFF;
  --sd-ink: #15161A; --sd-ink-2: #474A52; --sd-ink-3: #666971;
  --sd-line: #E6E6E2; --sd-line-ui: #83868D;
  --sd-accent: #2D4BC8; --sd-accent-ink: #FFFFFF; --sd-accent-soft: #E8ECFB;
  --sd-positive: #1D7A4C; --sd-positive-soft: #E2F2E8;
  --sd-warning: #9A5700; --sd-warning-soft: #FBEFD9; --sd-warning-ink: #FFFFFF;
  --sd-focus: #2D4BC8; --sd-scrim: rgb(12 13 16 / .40);
  --sd-logo-bg: #FFFFFF; --sd-logo-ring: rgb(21 22 26 / .08);
  --sd-header-bg: rgb(245 245 243 / .86); --sd-tabbar-bg: rgb(255 255 255 / .92);
  --sd-toast-action: #AFC0FF;
  --sd-sector-health: #B8325A;     --sd-sector-health-soft: #FBE9EF;
  --sd-sector-robotics: #A84B0C;   --sd-sector-robotics-soft: #FCEBDD;
  --sd-sector-mobility: #0A6A9E;   --sd-sector-mobility-soft: #E1F0F8;
  --sd-sector-climate: #2D7432;    --sd-sector-climate-soft: #E5F2E3;
  --sd-sector-fintech: #0C6F64;    --sd-sector-fintech-soft: #DDF1EE;
  --sd-sector-infra: #3F5A7A;      --sd-sector-infra-soft: #E6ECF3;
  --sd-sector-enterprise: #80600F; --sd-sector-enterprise-soft: #F5EDD6;
  --sd-sector-consumer: #A0368F;   --sd-sector-consumer-soft: #F7E5F3;
  --sd-sector-ai: #6646BF;         --sd-sector-ai-soft: #EEE8FA;
  --sd-shadow-1: 0 1px 2px rgb(16 17 20 / .04), 0 0 0 1px rgb(16 17 20 / .04);
  --sd-shadow-2: 0 4px 16px rgb(16 17 20 / .08), 0 0 0 1px rgb(16 17 20 / .04);
  --sd-shadow-3: 0 12px 40px rgb(16 17 20 / .16);
}
[data-theme="dark"] {
  color-scheme: dark;
  --sd-bg: #111214; --sd-surface: #1A1B1E; --sd-surface-2: #25272B; --sd-surface-raised: #2C2E33;
  --sd-ink: #EDEEF0; --sd-ink-2: #B6B9C0; --sd-ink-3: #9498A0;
  --sd-line: #2A2C30; --sd-line-ui: #6E727A;
  --sd-accent: #8EA1FF; --sd-accent-ink: #0E1330; --sd-accent-soft: #232B4D;
  --sd-positive: #5FCB92; --sd-positive-soft: #163323;
  --sd-warning: #F2B24E; --sd-warning-soft: #3A2C14; --sd-warning-ink: #1A1206;
  --sd-focus: #8EA1FF; --sd-scrim: rgb(0 0 0 / .56);
  --sd-logo-ring: rgb(255 255 255 / .10);
  --sd-header-bg: rgb(17 18 20 / .86); --sd-tabbar-bg: rgb(26 27 30 / .92);
  --sd-toast-action: #8EA1FF;
  --sd-sector-health: #F28AA5;     --sd-sector-health-soft: #3A1E27;
  --sd-sector-robotics: #F2A066;   --sd-sector-robotics-soft: #3A2618;
  --sd-sector-mobility: #6CC0EC;   --sd-sector-mobility-soft: #16303D;
  --sd-sector-climate: #86CF7C;    --sd-sector-climate-soft: #1D3320;
  --sd-sector-fintech: #5FD0C1;    --sd-sector-fintech-soft: #14322F;
  --sd-sector-infra: #9DB4D3;      --sd-sector-infra-soft: #232C38;
  --sd-sector-enterprise: #E2C063; --sd-sector-enterprise-soft: #352D17;
  --sd-sector-consumer: #E994DA;   --sd-sector-consumer-soft: #36203A;
  --sd-sector-ai: #B9A2F5;         --sd-sector-ai-soft: #2A2442;
  --sd-shadow-1: 0 0 0 1px rgb(255 255 255 / .04);
  --sd-shadow-2: 0 0 0 1px rgb(255 255 255 / .06);
  --sd-shadow-3: 0 12px 40px rgb(0 0 0 / .5);
}
:root {
  --sd-font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --sd-dur-1: 120ms; --sd-dur-2: 200ms; --sd-dur-3: 320ms;
  --sd-ease: cubic-bezier(.2,.8,.2,1);
  --sd-r-xs: 6px; --sd-r-sm: 10px; --sd-r-md: 14px; --sd-r-lg: 18px; --sd-r-xl: 24px;
  /* page chrome (outside the phones) */
  --pg-bg: #E9E9E6; --pg-ink: #15161A; --pg-ink-2: #55585F;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --pg-bg: #0B0C0D; --pg-ink: #EDEEF0; --pg-ink-2: #A3A6AD; }
}
@media (prefers-reduced-motion: reduce) { :root { --sd-dur-1: 1ms; --sd-dur-2: 120ms; --sd-dur-3: 120ms; } }

* { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
body {
  margin: 0; background: var(--pg-bg); color: var(--pg-ink);
  font-family: var(--sd-font); font-size: 15px; line-height: 24px; letter-spacing: -0.006em;
  word-break: keep-all; overflow-wrap: anywhere; line-break: strict;
}
.num { font-variant-numeric: tabular-nums lining-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ===== page chrome ===== */
.page { max-width: 1640px; margin: 0 auto; padding: 40px 16px 80px; }
.intro { max-width: 760px; margin: 0 0 32px; }
.intro h1 { font-size: 28px; line-height: 36px; letter-spacing: -0.024em; margin: 0 0 8px; font-weight: 700; }
.intro p { margin: 0 0 6px; color: var(--pg-ink-2); }
.row-label { font-size: 13px; line-height: 18px; font-weight: 600; color: var(--pg-ink-2); margin: 0 0 12px; }
.phones { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; margin-bottom: 56px; }
.phone-wrap { width: min(375px, 100%); }

/* ===== phone frame ===== */
.phone {
  position: relative; width: 100%; height: 812px; overflow: hidden;
  border-radius: 36px; background: var(--sd-bg); color: var(--sd-ink);
  box-shadow: 0 0 0 1px rgb(0 0 0 / .08), 0 24px 60px rgb(0 0 0 / .14);
}
.screen { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.screen::-webkit-scrollbar { display: none; }
.status { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; font-size: 15px; font-weight: 600; }
.status .dots { display: flex; gap: 5px; align-items: center; }
.status .dots i { width: 17px; height: 10px; border-radius: 3px; background: currentColor; opacity: .9; display: block; }
.status .dots i:first-child { width: 14px; opacity: .6; }

svg.ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.ic.s16 { width: 16px; height: 16px; }
svg.ic.s14 { width: 14px; height: 14px; }
svg.ic.s20 { width: 20px; height: 20px; }

/* app header */
.appbar {
  position: sticky; top: 0; z-index: 5; height: 52px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 8px 0 20px; background: var(--sd-header-bg);
  -webkit-backdrop-filter: saturate(1.4) blur(16px); backdrop-filter: saturate(1.4) blur(16px);
}
.wordmark { font-size: 18px; font-weight: 800; letter-spacing: -0.03em; display: flex; align-items: center; gap: 0; }
.wordmark::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--sd-accent); margin-left: 3px; margin-top: 7px; }
.iconbtn {
  width: 44px; height: 44px; border: 0; border-radius: 999px; background: transparent; color: var(--sd-ink-2);
  display: inline-grid; place-items: center; cursor: pointer;
  transition: background var(--sd-dur-1) var(--sd-ease), transform var(--sd-dur-1) var(--sd-ease);
}
.iconbtn:hover { background: var(--sd-surface-2); }
.iconbtn:active { transform: scale(.94); }
:focus-visible { outline: 2px solid var(--sd-focus); outline-offset: 2px; }

.content { padding: 8px 20px 104px; }

/* page title */
.eyebrow { font-size: 13px; line-height: 18px; font-weight: 600; color: var(--sd-ink-3); margin: 0 0 4px; }
.ptitle { font-size: 28px; line-height: 36px; font-weight: 700; letter-spacing: -0.024em; margin: 0; }
.psub { margin: 6px 0 24px; color: var(--sd-ink-2); }

/* section header */
.sh { display: flex; align-items: center; justify-content: space-between; margin-top: 40px; min-height: 44px; }
.sh h2 { font-size: 21px; line-height: 30px; font-weight: 700; letter-spacing: -0.018em; margin: 0; }
.sh a { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; color: var(--sd-accent); font-weight: 600; text-decoration: none; }
.sh-desc { font-size: 13px; line-height: 18px; color: var(--sd-ink-3); margin: -6px 0 12px; }

/* logo + monogram */
.logo {
  --size: 44px; width: var(--size); height: var(--size); flex: none;
  border-radius: calc(var(--size) * .26); background: var(--sd-logo-bg);
  box-shadow: inset 0 0 0 1px var(--sd-logo-ring);
  display: grid; place-items: center; overflow: hidden;
}
.logo svg { width: 64%; height: 64%; }
.logo.l40 { --size: 40px; } .logo.l48 { --size: 48px; } .logo.l64 { --size: 64px; border-radius: 16px; }
.logo.l44 { border-radius: 12px; } .logo.l48 { border-radius: 12px; } .logo.l40 { border-radius: 10px; }
.mono {
  background: var(--soft); color: var(--fg); box-shadow: none;
  font-weight: 700; font-size: calc(var(--size) * .42); letter-spacing: -0.02em; line-height: 1;
}
.sec-health { --fg: var(--sd-sector-health); --soft: var(--sd-sector-health-soft); }
.sec-robotics { --fg: var(--sd-sector-robotics); --soft: var(--sd-sector-robotics-soft); }
.sec-mobility { --fg: var(--sd-sector-mobility); --soft: var(--sd-sector-mobility-soft); }
.sec-climate { --fg: var(--sd-sector-climate); --soft: var(--sd-sector-climate-soft); }
.sec-fintech { --fg: var(--sd-sector-fintech); --soft: var(--sd-sector-fintech-soft); }
.sec-infra { --fg: var(--sd-sector-infra); --soft: var(--sd-sector-infra-soft); }
.sec-enterprise { --fg: var(--sd-sector-enterprise); --soft: var(--sd-sector-enterprise-soft); }
.sec-consumer { --fg: var(--sd-sector-consumer); --soft: var(--sd-sector-consumer-soft); }
.sec-ai { --fg: var(--sd-sector-ai); --soft: var(--sd-sector-ai-soft); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--fg); flex: none; display: inline-block; }

/* featured card */
.card {
  display: block; text-decoration: none; color: inherit;
  background: var(--sd-surface); border-radius: var(--sd-r-lg); box-shadow: var(--sd-shadow-1);
  padding: 20px; transition: box-shadow var(--sd-dur-1) var(--sd-ease), transform var(--sd-dur-1) var(--sd-ease);
}
.card:hover { box-shadow: var(--sd-shadow-2); }
.card:active { transform: scale(.99); }
.card-top { display: flex; align-items: center; gap: 12px; }
.meta { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--sd-ink-3); }
.sector { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; font-weight: 600; color: var(--sd-ink-2); }
.card h3 { font-size: 21px; line-height: 30px; font-weight: 700; letter-spacing: -0.018em; margin: 14px 0 4px; }
.card .tag { font-size: 17px; line-height: 27px; color: var(--sd-ink-2); margin: 0; letter-spacing: -0.01em;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.why-label { font-size: 13px; line-height: 18px; font-weight: 600; color: var(--sd-accent); margin: 16px 0 4px; }
.why { margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.facts-inline { display: flex; gap: 24px; margin-top: 16px; }
.facts-inline div { display: flex; flex-direction: column; }
.facts-inline b { font-size: 17px; line-height: 24px; font-weight: 700; letter-spacing: -0.01em; }

/* row group */
.group { background: var(--sd-surface); border-radius: var(--sd-r-lg); box-shadow: var(--sd-shadow-1); padding: 0 16px; margin-top: 12px; }
.crow {
  position: relative; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
  min-height: 72px; padding: 14px 0; text-decoration: none; color: inherit;
}
.crow + .crow::before { content: ""; position: absolute; top: 0; left: 56px; right: 0; height: 1px; background: var(--sd-line); }
.contest + .contest::before { left: 56px; }
.crow .body { min-width: 0; }
.crow .name { display: flex; align-items: center; gap: 6px; min-width: 0; }
.crow .name b { font-size: 17px; line-height: 24px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crow .line2 { color: var(--sd-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.crow .fig { align-self: start; padding-top: 1px; font-weight: 600; color: var(--sd-ink-2); }
.crow.read b, .crow.read .fig { color: var(--sd-ink-3); }
.crow.read .logo { opacity: .72; }

/* badges */
.badge { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: var(--sd-r-xs);
  font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: .01em; flex: none; white-space: nowrap; }
.b-yc { background: var(--sd-surface-2); color: var(--sd-ink); font-weight: 700; }
.b-new { background: var(--sd-accent-soft); color: var(--sd-accent); }
.b-sector { background: var(--sd-surface-2); color: var(--sd-ink-2); gap: 6px; }
.b-est { background: var(--sd-warning-soft); color: var(--sd-warning); }
.dday { width: 44px; height: 24px; border-radius: var(--sd-r-xs); display: grid; place-items: center;
  font-size: 13px; line-height: 18px; font-weight: 700; align-self: start; margin-top: 2px; }
.d-today { background: var(--sd-warning); color: var(--sd-warning-ink); }
.d-soon { background: var(--sd-warning-soft); color: var(--sd-warning); }
.d-later { background: var(--sd-surface-2); color: var(--sd-ink-2); }

/* contest row */
.contest { grid-template-columns: 44px 1fr 44px; align-items: start; }
.contest .title { font-size: 17px; line-height: 24px; font-weight: 600; letter-spacing: -0.01em;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.contest .iconbtn { margin: -10px -12px 0 0; }

.trust { margin-top: 40px; text-align: center; }
.trust a { color: var(--sd-ink-2); }

/* tab bar */
.tabbar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; height: 56px; padding-bottom: 0;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--sd-tabbar-bg); box-shadow: inset 0 1px 0 var(--sd-line);
  -webkit-backdrop-filter: saturate(1.4) blur(16px); backdrop-filter: saturate(1.4) blur(16px);
}
.phone .tabbar { height: 82px; padding-bottom: 26px; } /* includes home-indicator safe area */
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--sd-ink-3);
  font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: .01em; text-decoration: none; }
.tab.on { color: var(--sd-ink); }
.tab.on svg { color: var(--sd-accent); fill: currentColor; fill-opacity: .14; }
.homebar { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--sd-ink); z-index: 7; opacity: .85; }

/* ===== profile ===== */
.dbar { position: sticky; top: 0; z-index: 5; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 4px;
  background: var(--sd-header-bg); -webkit-backdrop-filter: saturate(1.4) blur(16px); backdrop-filter: saturate(1.4) blur(16px); }
.dbar .right { display: flex; }
.progress { position: absolute; left: 0; bottom: -2px; height: 2px; width: 9%; background: var(--sd-accent); }
.pcontent { padding: 8px 20px 120px; }
.pname { font-size: 28px; line-height: 36px; font-weight: 700; letter-spacing: -0.024em; margin: 16px 0 4px; }
.psite { color: var(--sd-ink-2); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.psite a { color: var(--sd-accent); text-decoration: none; display: inline-flex; align-items: center; gap: 2px; font-weight: 500; }
.badges { display: flex; gap: 6px; margin-top: 12px; }
.ptag { font-size: 17px; line-height: 29px; font-weight: 600; letter-spacing: -0.01em; margin: 20px 0 24px; }
.facts { background: var(--sd-surface-2); border-radius: var(--sd-r-lg); padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px 16px; }
.fact .lab { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--sd-ink-3); display: flex; justify-content: space-between; align-items: center; }
.fact .val { font-size: 21px; line-height: 30px; font-weight: 700; letter-spacing: -0.018em; margin-top: 4px; }
.fact .sub { font-size: 13px; line-height: 18px; color: var(--sd-ink-3); }
.psec { padding-top: 32px; }
.psec + .psec { margin-top: 32px; box-shadow: inset 0 1px 0 var(--sd-line); }
.psec-h { display: flex; align-items: center; justify-content: space-between; min-height: 44px; width: 100%; border: 0; background: none; padding: 0;
  color: inherit; font: inherit; text-align: left; cursor: pointer; }
.psec-h h2 { font-size: 21px; line-height: 30px; font-weight: 700; letter-spacing: -0.018em; margin: 0; }
.psec-h svg { color: var(--sd-ink-3); transition: transform var(--sd-dur-2) var(--sd-ease); }
.psec-h[aria-expanded="true"] svg { transform: rotate(180deg); }
.reading { font-size: 17px; line-height: 29px; letter-spacing: -0.01em; margin: 8px 0 0; }
.preview { color: var(--sd-ink-2); margin: 4px 0 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.trustline { display: flex; align-items: center; gap: 6px; margin-top: 16px; }
.trustline svg { color: var(--sd-positive); }
.actionbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; gap: 8px; align-items: center;
  padding: 10px 16px 34px; background: var(--sd-tabbar-bg); box-shadow: inset 0 1px 0 var(--sd-line);
  -webkit-backdrop-filter: saturate(1.4) blur(16px); backdrop-filter: saturate(1.4) blur(16px); }
.btn { height: 44px; padding: 0 20px; border: 0; border-radius: var(--sd-r-md); font: inherit; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
  transition: transform var(--sd-dur-1) var(--sd-ease), background var(--sd-dur-1) var(--sd-ease); }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--sd-accent); color: var(--sd-accent-ink); }
.btn-primary:hover { background: color-mix(in srgb, var(--sd-accent) 94%, black); }
.btn-secondary { background: var(--sd-surface-2); color: var(--sd-ink); }
.btn-ghost { background: transparent; color: var(--sd-accent); }
.btn-ghost:hover { background: var(--sd-accent-soft); }
.actionbar .btn-primary { flex: 1; height: 52px; }
.btn-primary .faint { opacity: .78; font-weight: 500; }

/* full-length view: show whole screens without inner scroll */
.full .phone { height: auto; }
.full .screen { position: relative; overflow: visible; }

/* ===== component sheet ===== */
.sheet-panel { background: var(--sd-bg); color: var(--sd-ink); border-radius: 24px; padding: 24px 20px; width: min(560px, 100%);
  box-shadow: 0 0 0 1px rgb(0 0 0 / .06); }
.sheet-panel h3 { font-size: 13px; line-height: 18px; font-weight: 600; color: var(--sd-ink-3); margin: 20px 0 10px; }
.sheet-panel h3:first-child { margin-top: 0; }
.wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { height: 36px; padding: 0 14px; border-radius: 999px; border: 0; font: inherit; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
  background: var(--sd-surface-2); color: var(--sd-ink-2); cursor: pointer; }
.chip.on { background: var(--sd-ink); color: var(--sd-surface); }
.seg { display: inline-grid; grid-template-columns: 1fr 1fr; background: var(--sd-surface-2); border-radius: 999px; padding: 3px; height: 40px; width: 220px; }
.seg span { display: grid; place-items: center; border-radius: 999px; font-weight: 600; color: var(--sd-ink-3); }
.seg span.on { background: var(--sd-surface); color: var(--sd-ink); box-shadow: var(--sd-shadow-1); }
[data-theme="dark"] .seg span.on { background: var(--sd-surface-raised); }
.toast { display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 8px 0 16px; border-radius: var(--sd-r-md);
  background: var(--sd-ink); color: var(--sd-surface); box-shadow: var(--sd-shadow-3); max-width: 340px; font-weight: 500; }
[data-theme="dark"] .toast { background: var(--sd-surface-raised); color: var(--sd-ink); }
.toast button { border: 0; background: none; color: var(--sd-toast-action); font: inherit; font-weight: 600; height: 44px; padding: 0 8px; cursor: pointer; }
.monos { display: grid; grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 12px 8px; }

<script>
  // stamp each template twice: light + dark
  const put = (tplId, rowId) => {
    const tpl = document.getElementById(tplId), row = document.getElementById(rowId);
    for (const theme of ['light', 'dark']) {
      const node = tpl.content.firstElementChild.cloneNode(true);
      node.setAttribute('data-theme', theme);
      const cap = document.createElement('p');
      cap.className = 'row-label';
      cap.textContent = theme === 'light' ? '라이트' : '다크';
      const box = document.createElement('div');
      box.className = tplId === 'tpl-parts' ? '' : 'phone-wrap';
      if (tplId === 'tpl-parts') box.style.width = 'min(560px, 100%)';
      box.append(cap, node);
      row.append(box);
    }
  };
  put('tpl-home', 'home-row');
  put('tpl-profile', 'profile-row');
  put('tpl-parts', 'parts-row');
  const tg = document.getElementById('toggle-full');
